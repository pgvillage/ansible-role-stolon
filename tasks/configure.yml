---
# EL10 has no /etc/sysctl.d by default (packages use /usr/lib/sysctl.d)
- name: Create sysctl folder
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Swapiness instellen
  ansible.builtin.copy:
    content: "{{ stolon_sysctl }}"
    dest: /etc/sysctl.d/postgresql.conf
    mode: "0600"
  notify: Apply sysctl changes

- name: Create sysconfig folder
  ansible.builtin.file:
    path: /etc/sysconfig
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Install stolon systemd services
  become: true
  become_user: "root"
  ansible.builtin.template:
    src: "{{ svc }}.j2"
    dest: "/etc/systemd/system/{{ svc }}"
    force: true
    mode: "0644"
  loop: "{{ stolon_services }}"
  vars:
    svc: "stolon-{{ item }}{% if stolon_multicluster %}@{% endif %}.service"
  notify: "Restart stolon-st{{ item }}"

- name: Config per cluster
  ansible.builtin.include_tasks: tasks/configure-cluster.yml
  loop: "{{ stolon_clusters | dict2items }}"
  loop_control:
    loop_var: cluster
