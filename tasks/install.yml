---
# tasks file for stolon
- name: Fail for unsupported architecture
  ansible.builtin.fail:
    msg: "Can't install stolon: unsupported arch ({{ ansible_facts.architecture }})."
  when:
    - ansible_facts.architecture != "x86_64"
    - stolon_package_names|length == 0

- name: Keep apt from starting services and creating a PostgreSQL main cluster
  ansible.builtin.include_tasks: apt-guard.yml
  when: ansible_facts.pkg_mgr == 'apt'

- name: Create stolon folders
  become: true
  become_user: "{{ stolon_binary_owner }}"
  ansible.builtin.file:
    state: directory
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    mode: "0755"
  loop:
    - path: "{{ stolon_opt_path }}"
      owner: root
    - path: "{{ stolon_release_path }}"
      owner: root
    - path: "{{ stolon_script_path }}"
      owner: "{{ stolon_user }}"
    - path: "{{ stolon_data_dir }}"
      owner: "{{ stolon_user }}"
    - path: "{{ stolon_config_dir }}"
      owner: "{{ stolon_user }}"
    - path: "{{ stolon_wal_dir }}"
      owner: "{{ stolon_user }}"
  loop_control:
    label: "{{ item.path }}"

- name: Deploy scripts
  ansible.builtin.template:
    src: "bin/{{ item }}.j2"
    dest: "{{ stolon_script_path }}/{{ item }}"
    mode: "0755"
    owner: "{{ stolon_user }}"
  loop:
    - demote.sh
    - movewal.sh
    - reinstate.sh

- name: Deploy templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: preserve
    owner: "{{ stolon_user }}"
  loop:
    - src: stolon_profile.sh.j2
      dest: "{{ stolon_script_path }}/stolon_profile"
    - src: pg_service.conf.j2
      dest: "{{ getent_passwd[stolon_user][4] }}/.pg_service.conf"

- name: Copy package
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/"
    mode: "0600"
  loop: "{{ stolon_local_package_names }}"

# A new stolon package (e.g. 0.19.7 -> 0.19.8) only takes effect when the services restart.
# The handlers restart them one host at a time (see handlers/main.yml).
- name: Install local stolon packages when defined
  become: true
  ansible.builtin.package:
    name: "/tmp/{{ item }}"
    state: "{{ stolon_package_name_state }}"
  loop: "{{ stolon_local_package_names }}"
  register: stolon_local_package_install
  notify:
    - Restart stolon-stkeeper
    - Restart stolon-stsentinel
    - Restart stolon-stproxy

- name: Install stolon packages when defined
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
    state: "{{ stolon_package_name_state }}"
  loop: "{{ stolon_package_names }}"
  register: stolon_package_install
  notify:
    - Restart stolon-stkeeper
    - Restart stolon-stsentinel
    - Restart stolon-stproxy

# The units, scripts and handlers run the binaries from stolon_bin_path. When they aren't there (e.g. an old
# stolon package that installed in /usr/local/bin, kept by stolon_package_name_state present), fail now, before the
# units and config change: the keepers would fail to start (203/EXEC).
- name: Find the stolon binaries
  ansible.builtin.stat:
    path: "{{ stolon_bin_path }}/{{ item }}"
  loop: "{{ _stolon_binaries }}"
  register: stolon_binaries

# In check mode, a package that would be installed isn't there yet
- name: Fail when the stolon binaries are not in stolon_bin_path
  ansible.builtin.fail:
    msg: >-
      {{ _missing | join(', ') }} not found in stolon_bin_path ({{ stolon_bin_path }}). Probably the stolon package
      is an old build, which installs in /usr/local/bin. Either set stolon_package_name_state: latest once (it upgrades
      the stolon package to the build that installs in /usr/bin), or set stolon_bin_path: /usr/local/bin (old builds).
  when:
    - _missing | length > 0
    - not (ansible_check_mode and (stolon_package_install is changed or stolon_local_package_install is changed))
  vars:
    _missing: "{{ stolon_binaries.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: Enable profiles
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    line: "{{ item.line }}"
    create: "true"
    owner: "{{ stolon_user }}"
    group: "{{ stolon_group }}"
    mode: "0700"
  loop:
    - path: "{{ getent_passwd[stolon_user][4] }}/.pgsql_profile"
      line: "source {{ stolon_script_path }}/stolon_profile"
    - path: "{{ getent_passwd[stolon_user][4] }}/.bash_profile"
      line: "[ -f ~/.pgsql_profile ] && source ~/.pgsql_profile"
