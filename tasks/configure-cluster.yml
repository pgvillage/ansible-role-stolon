---
- name: Install sysconfig configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: "stolon.sysconfig.j2"
    dest: "{{ sysconfig_file }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ sysconfig | dict2items }}"
  loop_control:
    label: "{{ settings.key }}"
    loop_var: settings
  vars:
    sysconfig_file: /etc/sysconfig/stolon-{{ settings.key }}{% if stolon_multicluster %}-{{ cluster.key }}{% endif %}
    sysconfig: "{{ stolon_default_sysconfig | combine((cluster.value.sysconfig | default({})), recursive=True) }}"
  notify: "Restart stolon-{{ settings.key }}"

# The data and WAL dirs get 0700, as initdb sets them: with 0750 every run changed them back
- name: Create postgres folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ stolon_user }}"
    group: "{{ stolon_group }}"
    mode: "{{ item.mode }}"
  vars:
    sysconfig: "{{ stolon_default_sysconfig | combine((cluster.value.sysconfig | default({})), recursive=True) }}"
    custom_config: "{{ stolon_default_custom_config | combine((cluster.value.custom_config | default({})), recursive=True) }}"
  loop:
    - path: "{{ sysconfig.stkeeper.pgdata_dir }}"
      mode: "0700"
    - path: "{{ sysconfig.stkeeper.wal_dir }}"
      mode: "0700"
    - path: "{{ custom_config.pgParameters.log_directory }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Get size of the WAL filesystem in bytes
  ansible.builtin.shell:
    cmd: "set -o pipefail && df -B1 . | awk '{if(NR==2){print $2}}'"
  args:
    chdir: "{{ sysconfig.stkeeper.wal_dir }}"
  vars:
    sysconfig: "{{ stolon_default_sysconfig | combine((cluster.value.sysconfig | default({})), recursive=True) }}"
  register: stolon_get_wal_dir_size
  changed_when: false

- name: Systemd config folder
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ configfolder }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  vars:
    configfolder: /etc/systemd/system/stolon-keeper{% if stolon_multicluster %}@{{ cluster.key }}{% endif %}.service.d/
    cgroups: "{{ stolon_default_cgroups | combine((cluster.value.cgroups | default({})), recursive=True) }}"
  when:
    - cgroups|length > 0

- name: Configure cgroups
  become: true
  become_user: root
  ansible.builtin.template:
    src: "stolon.cgroups.j2"
    dest: "{{ configfile }}"
    owner: "root"
    group: "root"
    mode: "0644"
  vars:
    configfile: /etc/systemd/system/stolon-keeper{% if stolon_multicluster %}@{{ cluster.key }}{% endif %}.service.d/cgroups.conf
    cgroups: "{{ stolon_default_cgroups | combine((cluster.value.cgroups | default({})), recursive=True) }}"
  when:
    - cgroups|length > 0
  notify: "Restart stolon-stkeeper"

- name: Install custom_config file
  become: true
  become_user: root
  ansible.builtin.template:
    src: "custom_config.yml.j2"
    dest: "{{ custom_config_file }}"
    owner: "{{ stolon_user }}"
    group: "{{ stolon_group }}"
    mode: "0644"
  vars:
    custom_config_file: "{{ stolon_config_dir }}/stolon_custom_config{% if stolon_multicluster %}-{{ cluster.key }}{% endif %}.yml"
    custom_config: "{{ {'pgParameters': stolon_wal_size_parameters} | combine((cluster.value.custom_config | default({})), recursive=True) }}"
  notify:
    - Update cluster spec

- name: Init when needed
  become: true
  become_user: "{{ stolon_user }}"
  ansible.builtin.shell:
    cmd: "{{ stolon_bin_path }}/stolonctl status || {{ stolon_bin_path }}/stolonctl init -y"
  args:
    creates: "{{ sysconfig.stkeeper.pgdata_dir }}/PG_VERSION"
    executable: "/bin/bash"
  vars:
    sysconfig: "{{ stolon_default_sysconfig | combine((cluster.value.sysconfig | default({})), recursive=True) }}"
  environment:
    STOLONCTL_CLUSTER_NAME: "{{ cluster.key }}"
    STOLONCTL_STORE_BACKEND: "{{ sysconfig.stkeeper.store_backend }}"

- name: Add logrotate
  ansible.builtin.copy:
    content: "{{ stolon_logrotate_config }}"
    dest: /etc/logrotate.d/postgresql-{{ cluster.key }}
    mode: "0644"
    owner: root
    group: root
  vars:
    custom_config: "{{ stolon_default_custom_config | combine((cluster.value.custom_config | default({})), recursive=True) }}"
    log_directory: "{{ custom_config.pgParameters.log_directory }}"
