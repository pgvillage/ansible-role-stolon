---
# First, before anything restarts PostgreSQL: a new cluster must run with its cluster spec from the start
# (the role creates it with the spec). The parameters that need a restart (shared_buffers,
# logging_collector) must be in effect, not pending a restart, and ssl must be on.
- name: Check the new clusters run with their cluster spec
  hosts: all
  gather_facts: false
  tasks:
    - name: Get the settings that need a restart, and the ones pending a restart
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - --host=/tmp
          - --port={{ item }}
          - --no-align
          - --tuples-only
          - --command
          - >-
            select current_setting('logging_collector'), current_setting('ssl'),
            (select coalesce(string_agg(name, ','), '') from pg_settings where pending_restart)
      loop: [5433, 5434]
      register: spec_settings
      failed_when: spec_settings.stdout != 'on|on|'
      changed_when: false

# Then the restart handlers: change the sysconfig of every stolon component of
# cluster1 behind the role's back, converge again (the role puts them back and
# notifies the restart handlers), and check every service was restarted. Then
# check stolon and PostgreSQL work, after that restart.
- name: Prepare a restart of the stolon services
  hosts: all
  gather_facts: false
  tasks:
    - name: Get the main PIDs of the stolon services
      ansible.builtin.systemd_service:
        name: stolon-{{ item[0] }}@{{ item[1] }}
      loop: "{{ ['keeper', 'sentinel', 'proxy'] | product(['cluster1', 'cluster2']) | list }}"
      register: services_before

    - name: Change the sysconfig of the stolon components of cluster1
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/stolon-{{ item }}-cluster1
        line: "# changed by molecule verify"
      loop: [stkeeper, stsentinel, stproxy]

- name: Converge again, which restarts the stolon services
  ansible.builtin.import_playbook: converge.yml

- name: Check the stolon services were restarted
  hosts: all
  gather_facts: false
  tasks:
    # A handler restarts a service for all clusters
    - name: Check every stolon service has a new main PID
      ansible.builtin.systemd_service:
        name: stolon-{{ item.item[0] }}@{{ item.item[1] }}
      loop: "{{ services_before.results }}"
      loop_control:
        label: "{{ item.item | join('@') }}"
      register: service_after
      failed_when: service_after.status.MainPID == item.status.MainPID

- name: Verify
  hosts: all
  gather_facts: true
  vars:
    # Expected min_wal_size and max_wal_size (MB): 25% and 75% of the size of
    # the WAL filesystem of the cluster (molecule.yml), with minimums 80 and 1024
    clusters:
      cluster1: {pg_port: 5433, proxy_port: 25433, wal_mount: /pgwal/cluster1, min_wal_size: 512, max_wal_size: 1536}
      cluster2: {pg_port: 5434, proxy_port: 25434, wal_mount: /pgwal/cluster2, min_wal_size: 1024, max_wal_size: 3072}
  tasks:
    - name: Check the stolon services are running and enabled
      ansible.builtin.systemd_service:
        name: stolon-{{ item[0] }}@{{ item[1] }}
      loop: "{{ ['keeper', 'sentinel', 'proxy'] | product(clusters | list) | list }}"
      register: service
      failed_when: service.status.ActiveState != 'active' or service.status.UnitFileState != 'enabled'

    # The keeper applies a new cluster spec within a few seconds
    - name: Get the role, ssl and WAL settings of PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - --host=/tmp
          - --port={{ item.value.pg_port }}
          - --no-align
          - --tuples-only
          - --command
          - >-
            select pg_is_in_recovery(), current_setting('ssl'),
            (select setting from pg_settings where name = 'min_wal_size'),
            (select setting from pg_settings where name = 'max_wal_size')
      loop: "{{ clusters | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: settings
      until: settings.stdout == 'f|on|' ~ item.value.min_wal_size ~ '|' ~ item.value.max_wal_size
      retries: 30
      delay: 2
      changed_when: false

    - name: Check pg_wal of every cluster is on its own WAL filesystem
      ansible.builtin.command: findmnt --noheadings --output TARGET --target /var/lib/pgsql/{{ item.key }}/postgres/pg_wal/
      loop: "{{ clusters | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: pg_wal_mount
      failed_when: pg_wal_mount.stdout != item.value.wal_mount
      changed_when: false

    - name: Connect through the stolon proxy, verifying the server certificate
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - "host={{ ansible_facts.fqdn }} port={{ item.value.proxy_port }} dbname=postgres sslmode=verify-full"
          - --no-align
          - --tuples-only
          - --command
          - select pg_is_in_recovery()
      loop: "{{ clusters | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: proxy
      failed_when: proxy.stdout != 'f'
      changed_when: false

    - name: Check the role created the users, as superusers
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - --host=/tmp
          - --port={{ item.value.pg_port }}
          - --no-align
          - --tuples-only
          - --command
          - select string_agg(rolname, ',' order by rolname) from pg_roles where rolsuper and rolname in ('nrpe', 'pgquartz', 'pgroute66')
      loop: "{{ clusters | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: users
      failed_when: users.stdout != 'nrpe,pgquartz,pgroute66'
      changed_when: false

# Upgrades outside the role (the linux role, unattended-upgrades): replace a binary (new ctime) after the
# services started, as a package upgrade does, and converge again. First the postgres binary: the role must
# restart the keepers (which restarts PostgreSQL), and leave the sentinels and proxies alone. Then the
# stolon binaries: the role must restart all stolon services.
- name: Upgrade the postgres binary behind the role's back
  hosts: all
  gather_facts: false
  tasks:
    - name: Get the main PIDs of the stolon services
      ansible.builtin.systemd_service:
        name: stolon-{{ item[0] }}@{{ item[1] }}
      loop: "{{ ['keeper', 'sentinel', 'proxy'] | product(['cluster1', 'cluster2']) | list }}"
      register: services_before_pg

    - name: Get the start time of PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: [/usr/pgsql-17/bin/psql, --host=/tmp, "--port={{ item }}", --no-align, --tuples-only,
               --command, "select pg_postmaster_start_time()"]
      loop: [5433, 5434]
      register: pg_start_before
      changed_when: false

    - name: Wait, as the start time and ctime have a resolution of 1s
      ansible.builtin.pause:
        seconds: 2

    - name: Replace the postgres binary, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/pgsql-17/bin/postgres /usr/pgsql-17/bin/postgres.new && mv /usr/pgsql-17/bin/postgres.new /usr/pgsql-17/bin/postgres
      changed_when: true

- name: Converge again, which restarts the keepers
  ansible.builtin.import_playbook: converge.yml

- name: Check the keepers and PostgreSQL were restarted, and only them
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the keepers have a new main PID, the sentinels and proxies not
      ansible.builtin.systemd_service:
        name: stolon-{{ item.item[0] }}@{{ item.item[1] }}
      loop: "{{ services_before_pg.results }}"
      loop_control:
        label: "{{ item.item | join('@') }}"
      register: service_after
      failed_when: (service_after.status.MainPID != item.status.MainPID) != (item.item[0] == 'keeper')

    - name: Check PostgreSQL has a new start time, and runs as a primary again
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: [/usr/pgsql-17/bin/psql, --host=/tmp, "--port={{ item.item }}", --no-align, --tuples-only,
               --command, "select pg_postmaster_start_time(), pg_is_in_recovery()"]
      loop: "{{ pg_start_before.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: pg_start_after
      until: pg_start_after.rc == 0
      retries: 30
      delay: 2
      failed_when: pg_start_after.rc != 0 or pg_start_after.stdout == item.stdout ~ '|f' or not pg_start_after.stdout.endswith('|f')
      changed_when: false

- name: Upgrade the stolon binaries behind the role's back
  hosts: all
  gather_facts: false
  tasks:
    - name: Get the main PIDs of the stolon services
      ansible.builtin.systemd_service:
        name: stolon-{{ item[0] }}@{{ item[1] }}
      loop: "{{ ['keeper', 'sentinel', 'proxy'] | product(['cluster1', 'cluster2']) | list }}"
      register: services_before_stolon

    - name: Wait, as the start time and ctime have a resolution of 1s
      ansible.builtin.pause:
        seconds: 2

    - name: Replace the stolon binaries, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/bin/{{ item }} /usr/bin/{{ item }}.new && mv /usr/bin/{{ item }}.new /usr/bin/{{ item }}
      loop: [stolon-keeper, stolon-sentinel, stolon-proxy]
      changed_when: true

- name: Converge again, which restarts the stolon services
  ansible.builtin.import_playbook: converge.yml

- name: Check the stolon services were restarted
  hosts: all
  gather_facts: false
  tasks:
    - name: Check every stolon service has a new main PID
      ansible.builtin.systemd_service:
        name: stolon-{{ item.item[0] }}@{{ item.item[1] }}
      loop: "{{ services_before_stolon.results }}"
      loop_control:
        label: "{{ item.item | join('@') }}"
      register: service_after
      failed_when: service_after.status.MainPID == item.status.MainPID

# Then the repair of a cluster: cluster1 gets the spec of a cluster created by `stolonctl init -y` (initMode only,
# as PgVillage v2.0.1 created it), and PostgreSQL restarts with it (no logging_collector, no ssl, no hba rules
# for certificates). cluster2 gets a parameter that waits for a restart (not in its custom_config file, so it
# stays). Converge again: the role applies the spec of cluster1 again (the file didn't change) and restarts the
# keepers of both clusters, after which nothing waits for a restart.
- name: Break the spec of cluster1, and set a parameter of cluster2 that needs a restart
  hosts: all
  gather_facts: false
  tasks:
    - name: Replace the spec of cluster1 with the one of stolonctl init -y
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: /usr/bin/stolonctl update --file -
        stdin: '{"initMode": "new"}'
      environment:
        STOLONCTL_CLUSTER_NAME: cluster1
        STOLONCTL_STORE_BACKEND: etcdv3
      changed_when: true

    - name: Set max_locks_per_transaction of cluster2
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: [/usr/bin/stolonctl, update, --patch, '{"pgParameters": {"max_locks_per_transaction": "128"}}']
      environment:
        STOLONCTL_CLUSTER_NAME: cluster2
        STOLONCTL_STORE_BACKEND: etcdv3
      changed_when: true

    - name: Wait until the keepers applied the specs (cluster1 without logging_collector, cluster2 pending)
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - --host=/tmp
          - --port={{ item.port }}
          - --no-align
          - --tuples-only
          - --command
          - select coalesce(string_agg(name, ','), '') from pg_settings where pending_restart
      loop:
        - {port: 5433, pending: logging_collector}
        - {port: 5434, pending: max_locks_per_transaction}
      register: pending
      until: item.pending in pending.stdout.split(',')
      retries: 30
      delay: 2
      changed_when: false

    - name: Restart the keeper of cluster1, so PostgreSQL runs with the broken spec
      ansible.builtin.systemd_service:
        name: stolon-keeper@cluster1
        state: restarted

    - name: Wait until PostgreSQL of cluster1 runs without logging_collector and ssl
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: [/usr/pgsql-17/bin/psql, --host=/tmp, --port=5433, --no-align, --tuples-only, --command,
               "select current_setting('logging_collector'), current_setting('ssl')"]
      register: broken
      until: broken.stdout == 'off|off'
      retries: 30
      delay: 2
      changed_when: false

    - name: Get the main PIDs of the keepers
      ansible.builtin.systemd_service:
        name: stolon-keeper@{{ item }}
      loop: [cluster1, cluster2]
      register: keepers_before_repair

- name: Converge again, which repairs the clusters
  ansible.builtin.import_playbook: converge.yml

- name: Check the clusters were repaired
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the keepers were restarted
      ansible.builtin.systemd_service:
        name: stolon-keeper@{{ item.item }}
      loop: "{{ keepers_before_repair.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: keeper_after
      failed_when: keeper_after.status.MainPID == item.status.MainPID

    - name: Check PostgreSQL runs with the spec, and nothing waits for a restart
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - /usr/pgsql-17/bin/psql
          - --host=/tmp
          - --port={{ item }}
          - --no-align
          - --tuples-only
          - --command
          - >-
            select current_setting('logging_collector'), current_setting('ssl'),
            (select coalesce(string_agg(name, ','), '') from pg_settings where pending_restart)
      loop: [5433, 5434]
      register: repaired
      until: repaired.stdout == 'on|on|'
      retries: 30
      delay: 2
      changed_when: false

    - name: Check max_locks_per_transaction of cluster2 is in effect
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: [/usr/pgsql-17/bin/psql, --host=/tmp, --port=5434, --no-align, --tuples-only, --command,
               show max_locks_per_transaction]
      register: max_locks
      failed_when: max_locks.stdout != '128'
      changed_when: false

# Last, the check of the stolon binaries: with stolonctl missing from stolon_bin_path (as with an old stolon package,
# which installs in /usr/local/bin), the role must fail right after the install, before it changes the units or the
# config: here the sysconfig of the keeper of cluster1, changed behind the role's back, must stay as it is.
- name: Check the role fails before changing anything when a stolon binary is missing
  hosts: all
  gather_facts: true
  vars_files:
    - vars/converge.yml
  tasks:
    - name: Move stolonctl away, as an old stolon package has it in /usr/local/bin
      ansible.builtin.command: mv /usr/bin/stolonctl /usr/local/bin/stolonctl
      changed_when: true

    - name: Change the sysconfig of the keeper of cluster1
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/stolon-stkeeper-cluster1
        line: "# changed by molecule verify"

    - name: Run the role, which must fail
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: pgvillage.stolon

        - name: Fail, as the role didn't
          ansible.builtin.set_fact:
            role_failed: false
      rescue:
        - name: Check the role failed on the missing binary, with what to do
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail when the stolon binaries are not in stolon_bin_path'
              - "'stolonctl not found in stolon_bin_path (/usr/bin)' in ansible_failed_result.msg"
              - "'stolon_package_name_state: latest' in ansible_failed_result.msg"
              - "'stolon_bin_path: /usr/local/bin' in ansible_failed_result.msg"
            fail_msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"

        - name: Note the role failed
          ansible.builtin.set_fact:
            role_failed: true

    - name: Check the role failed
      ansible.builtin.assert:
        that: role_failed

    - name: Check the sysconfig of the keeper of cluster1 still has the change
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/stolon-stkeeper-cluster1
        line: "# changed by molecule verify"
      check_mode: true
      register: sysconfig_change
      failed_when: sysconfig_change is changed

    - name: Put stolonctl back
      ansible.builtin.command: mv /usr/local/bin/stolonctl /usr/bin/stolonctl
      changed_when: true

    - name: Undo the change of the sysconfig
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/stolon-stkeeper-cluster1
        line: "# changed by molecule verify"
        state: absent
