---
- name: Converge
  hosts: all
  # Every container is a cluster of its own. The role creates the users and
  # applies the cluster spec with run_once, so converge one host at a time.
  serial: 1
  # The WAL dir of every cluster is a folder on its own WAL filesystem (a tmpfs
  # mounted on /pgwal/<cluster>): the keeper removes and recreates the WAL dir
  # before initdb, which fails on a mount point.
  vars_files:
    - vars/converge.yml
  tasks:
    - name: Converge, and show the stolon and etcd logs when it fails
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: pgvillage.stolon
      rescue:
        - name: Get the logs of stolon and etcd
          ansible.builtin.command: journalctl --no-pager --lines 200 --unit 'stolon-*' --unit etcd
          register: logs
          changed_when: false

        - name: Show the logs of stolon and etcd
          ansible.builtin.debug:
            var: logs.stdout_lines

        - name: Fail, as the role failed
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The role failed') }}"
