---
# The variables of converge.yml, also used by verify.yml
stolon_multicluster: true
# Containers can't set kernel parameters
stolon_sysctl_apply: false
# The certificates are created in prepare.yml (as chainsmith does in PgVillage)
stolon_cert_managed: false
stolon_pg_certdir: /var/lib/pgsql/certs
stolon_cluster_hosts: "{{ ansible_facts.fqdn }}"
# As in PgVillage (inventories/standard): with defaultSUReplAccessMode
# strict, stolon only lets the other keepers in, and each cluster here has one
stolon_pg_hba:
  - local all all ident
  - hostssl all all samenet cert
stolon_clusters:
  cluster1:
    sysconfig:
      stsentinel:
        cluster_name: cluster1
      stkeeper:
        cluster_name: cluster1
        pg_port: 5433
        data_dir: /var/lib/pgsql/cluster1
        pgdata_dir: /var/lib/pgsql/cluster1/postgres
        wal_dir: /pgwal/cluster1/wal
        pgwal_dir: /pgwal/cluster1/wal
      stproxy:
        cluster_name: cluster1
        port: 25433
    custom_config:
      pgParameters:
        log_directory: /var/lib/pgsql/log/cluster1
  cluster2:
    sysconfig:
      stsentinel:
        cluster_name: cluster2
      stkeeper:
        cluster_name: cluster2
        pg_port: 5434
        data_dir: /var/lib/pgsql/cluster2
        pgdata_dir: /var/lib/pgsql/cluster2/postgres
        wal_dir: /pgwal/cluster2/wal
        pgwal_dir: /pgwal/cluster2/wal
      stproxy:
        cluster_name: cluster2
        port: 25434
    custom_config:
      pgParameters:
        log_directory: /var/lib/pgsql/log/cluster2
