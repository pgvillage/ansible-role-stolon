---
# Tests the role on Ubuntu 26.04 in a systemd container: one stolon cluster with a single keeper, with stolon and
# etcd from the PgVillage apt repo and PostgreSQL 17 from PGDG (see prepare.yml). The role installs PostgreSQL itself
# here (converge.yml adds it to stolon_package_names), after its apt guard: verify.yml checks apt neither started a
# service nor created a main cluster.
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml
driver:
  name: podman
platforms:
  - name: stolon-ubuntu2604
    image: docker.io/geerlingguy/docker-ubuntu2604-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    systemd: always
    groups:
      - etcd_ubuntu
provisioner:
  name: ansible
  inventory:
    host_vars:
      stolon-ubuntu2604:
        etcd_master_group_name: etcd_ubuntu
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
